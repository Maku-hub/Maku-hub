  <text x="24" y="36" clip-path="url(#c0)"><tspan fill="#7ee787">maku@hub</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#a66bff">~</tspan><tspan fill="#8b949e">$ </tspan><tspan fill="#f0f6fc">cat /etc/motd</tspan></text><text x="24" y="58" fill="#d2a8ff" opacity="0">Welcome to Maku's corner of GitHub.<set attributeName="opacity" to="1" begin="1.85s" fill="freeze"/></text><text x="24" y="80" fill="#d2a8ff" opacity="0">Connecting people, systems, and ideas into working solutions.<set attributeName="opacity" to="1" begin="2.03s" fill="freeze"/></text><text x="24" y="102" clip-path="url(#c3)"><tspan fill="#7ee787">maku@hub</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#a66bff">~</tspan><tspan fill="#8b949e">$ </tspan><tspan fill="#f0f6fc">cat role.txt</tspan></text><text x="24" y="124" fill="#c9d1d9" opacity="0">Platform Engineer — reliable systems, secure by default.<set attributeName="opacity" to="1" begin="3.41s" fill="freeze"/></text><text x="24" y="146" clip-path="url(#c5)"><tspan fill="#7ee787">maku@hub</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#a66bff">~</tspan><tspan fill="#8b949e">$ </tspan><tspan fill="#f0f6fc">ls ~/toolbox | more</tspan></text><text x="24" y="168" fill="#79c0ff" opacity="0">linux/  docker/  kubernetes/  helm/  terraform/  ansible/  nginx/<set attributeName="opacity" to="1" begin="5.14s" fill="freeze"/></text><text x="24" y="190" fill="#79c0ff" opacity="0">github-actions/  gitlab-ci/  prometheus/  grafana/  loki/  vault/<set attributeName="opacity" to="1" begin="5.32s" fill="freeze"/></text><text x="24" y="212" fill="#79c0ff" opacity="0">trivy/  cyclonedx/  semgrep/  sonarqube/  burp-suite/  nmap/  wireshark/<set attributeName="opacity" to="1" begin="5.50s" fill="freeze"/></text><g opacity="0"><set attributeName="opacity" to="1" begin="5.68s" fill="freeze"/><rect x="22" y="221" width="98" height="17" fill="#c9d1d9"/><text x="24" y="234" fill="#0d1117">--More--(32%)</text></g><text x="24" y="256" clip-path="url(#c10)"><tspan fill="#7ee787">maku@hub</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#a66bff">~</tspan><tspan fill="#8b949e">$ </tspan><tspan fill="#f0f6fc">./scan --interests</tspan></text><text x="24" y="278" fill="#ffa657" opacity="0">[+] system-design         [+] embedded   [+] smarthome<set attributeName="opacity" to="1" begin="7.78s" fill="freeze"/></text><text x="24" y="300" fill="#ffa657" opacity="0">[+] cybersecurity         [+] gambling   [+] scuba diving<set attributeName="opacity" to="1" begin="7.96s" fill="freeze"/></text><text x="24" y="322" clip-path="url(#c13)"><tspan fill="#7ee787">maku@hub</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#a66bff">~</tspan><tspan fill="#8b949e">$ </tspan><tspan fill="#f0f6fc">sudo rm -rf /bugs</tspan></text><text x="24" y="344" fill="#f85149" opacity="0">[sudo] password for maku: ********  — nice try.<set attributeName="opacity" to="1" begin="9.59s" fill="freeze"/></text><text x="24" y="366" opacity="0"><tspan fill="#7ee787">maku@hub</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#a66bff">~</tspan><tspan fill="#8b949e">$ </tspan><set attributeName="opacity" to="1" begin="9.77s" fill="freeze"/></text><rect x="110" y="354" width="8" height="15" fill="#a66bff" opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" begin="9.77s" repeatCount="indefinite"/></rect>
